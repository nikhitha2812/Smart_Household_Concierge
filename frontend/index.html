</div>

<script>

    // Your Render backend
    const API_URL = "https://home-sync-agent.onrender.com";

    // Your ADK application name
    const APP_NAME = "app";

    // One user ID for this browser
    let userId = localStorage.getItem("homesync_user_id");

    if (!userId) {
        userId = "user_" + crypto.randomUUID();
        localStorage.setItem("homesync_user_id", userId);
    }

    // Keep the same session during this browser session
    let sessionId = sessionStorage.getItem("homesync_session_id");

    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");


    function addMessage(text, sender) {

        const message = document.createElement("div");

        message.className = "message " + sender;

        const bubble = document.createElement("div");

        bubble.className = "bubble";

        bubble.textContent = text;

        message.appendChild(bubble);

        chat.appendChild(message);

        chat.scrollTop = chat.scrollHeight;

        return bubble;
    }


    async function createSession() {

        const response = await fetch(
            `${API_URL}/apps/${APP_NAME}/users/${userId}/sessions`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({})
            }
        );

        if (!response.ok) {
            throw new Error("Could not create session");
        }

        const data = await response.json();

        sessionId = data.id;

        sessionStorage.setItem(
            "homesync_session_id",
            sessionId
        );

        return sessionId;
    }


    async function sendMessage() {

        const message = input.value.trim();

        if (!message) {
            return;
        }

        addMessage(message, "user");

        input.value = "";

        sendButton.disabled = true;

        const assistantBubble = addMessage(
            "Thinking...",
            "assistant"
        );

        try {

            if (!sessionId) {
                await createSession();
            }

            const response = await fetch(
                `${API_URL}/run_sse`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        app_name: APP_NAME,

                        user_id: userId,

                        session_id: sessionId,

                        new_message: {
                            role: "user",
                            parts: [
                                {
                                    text: message
                                }
                            ]
                        },

                        // false gives us the complete response
                        // instead of token streaming
                        streaming: false
                    })
                }
            );


            if (!response.ok) {

                throw new Error(
                    `Server error: ${response.status}`
                );

            }


            const result = await response.text();

            console.log("ADK response:", result);


            /*
             * ADK returns SSE events like:
             *
             * data: {"content":{"parts":[{"text":"Hello!"}]...}}
             *
             * Extract the final model text.
             */

            const lines = result.split("\n");

            let finalText = "";

            for (const line of lines) {

                if (!line.startsWith("data:")) {
                    continue;
                }

                const jsonText = line.substring(5).trim();

                if (!jsonText) {
                    continue;
                }

                try {

                    const event = JSON.parse(jsonText);

                    if (
                        event.content &&
                        event.content.parts
                    ) {

                        for (
                            const part
                            of event.content.parts
                        ) {

                            if (part.text) {

                                finalText += part.text;

                            }

                        }

                    }

                } catch (error) {

                    console.log(
                        "Skipping SSE event:",
                        jsonText
                    );

                }

            }


            if (!finalText.trim()) {

                finalText =
                    "The agent responded, but no text response was returned.";

            }

            assistantBubble.textContent =
                finalText.trim();


        } catch (error) {

            console.error(error);

            assistantBubble.textContent =
                "❌ Sorry, I couldn't connect to HomeSync AI.\n\n" +
                error.message;

        }


        sendButton.disabled = false;

        input.focus();

    }


    sendButton.addEventListener(
        "click",
        sendMessage
    );


    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );

</script>
